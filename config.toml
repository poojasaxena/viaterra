# Travel memorabilia
# -------------------------------------------------

[illustrations.travel]
luggage_tag = "data/assets/illustrations/travel/luggage/luggage_tag.png"
morocco_luggage_tag = "data/assets/illustrations/travel/luggage/morocco_luggage_tag.png"

air_ticket = "data/assets/illustrations/travel/documents/air_ticket.png"
travel_bucket_list = "data/assets/illustrations/travel/documents/travel_bucket_list.png"
italy_guide = "data/assets/illustrations/travel/documents/italy_travel_guide.png"
travel_passport = "data/assets/illustrations/travel/documents/travel_passport.png"

