# =============================================================
# VIATERRA — CONFIGURATION
# Frequently adjusted visual controls are at the top.
# Stable asset paths and homepage decorations are further below.
# =============================================================


# -------------------------------------------------------------
# ACTIVE — Header logo layout
# -------------------------------------------------------------
[header.left_logo]
desktop_size = 165
desktop_top = 0
desktop_left = 0

tablet_size = 110
tablet_top = 5

mobile_visible = false


# -------------------------------------------------------------
# ACTIVE — Branding colours and logo assets
# -------------------------------------------------------------
[branding]
author_logo_color = "#427B7A"
viaterra_wordmark_color = "#286B73"
anchor_octopus = "data/assets/branding/anchor_octopus.png"
anchor_dolphin = "data/assets/branding/anchor_dolphin_octopus.png"
anchor_birds = "data/assets/branding/anchor_birds.png"
author_logo = "data/assets/branding/author_logo.svg"
maritime_logo = "data/assets/branding/anchor_maritime.png"
anchor_v1 = "data/assets/branding/anchor_maritime_engraving.png"


# -------------------------------------------------
# Page header appearance
# -------------------------------------------------

[header.wordmarks.viaterra]
width = 340
height = 90
scale = 1.0
offset_y = 0
margin_bottom = 0

[header.wordmarks.echoes]
width = 340
height = 90
scale = 1.40
offset_y = 5
margin_bottom = -12

[header.wordmarks.footprints]
width = 340
height = 90
scale = 1.0
offset_y = 0
margin_bottom = 0

[header.wordmarks.the_world_in_cities]
width = 340
height = 90
scale = 1.0
offset_y = 0
margin_bottom = 0

[header.wordmarks.travel_statistics]
width = 340
height = 90
scale = 1.0
offset_y = 0
margin_bottom = 0

[header.wordmarks.about_viaterra]
width = 340
height = 90
scale = 1.0
offset_y = 0
margin_bottom = 0

# -------------------------------------------------------------
# ACTIVE — Theme colours
# -------------------------------------------------------------
[theme]
background = "#F8F4EB"
primary = "#17466C"
secondary = "#557786"
accent = "#C7A165"


# -------------------------------------------------------------
# ACTIVE — Main map
# -------------------------------------------------------------
[map]
height = 640
center_longitude = 2.0
center_latitude = 20.0
zoom = 1.25


# -------------------------------------------------------------
# ACTIVE — Sea colours and texture
# -------------------------------------------------------------
[map.sea]
color = "#438FA6"
deep_color = "#367A91"
light_color = "#65AABB"
broad_strength = 12.0
ripple_strength = 0.0
glint_red = 0.0
glint_green_blue = 0.0


# -------------------------------------------------------------
# ACTIVE — Markers
# -------------------------------------------------------------
[map.markers]
fill = "#C47A24"
border = "#FFFCF5"
flag = "#FFFFFF"


# -------------------------------------------------------------
# ACTIVE — Map frame
# -------------------------------------------------------------
[map.frame]
enabled = true
asset = "viaterra_torquise_border"

width = 18
opacity = 1.0
slice_vertical = 14
slice_horizontal = 10


# -------------------------------------------------------------
# ASSET PATHS — Project directories
# -------------------------------------------------------------
[directories]
data = "data"
assets = "data/assets"
headers = "data/assets/headers"
branding = "data/assets/branding"
gallery = "data/gallary"
illustrations = "data/assets/illustrations"
compasses = "data/assets/illustrations/nautical/compasses"


