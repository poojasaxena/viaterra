[map.markers]
fill = "#C47A24"
border = "#FFFCF5"
flag = "#FFFFFF"

[map.frame]
enabled = true

edge_dark = "#6F5741"
edge_mid = "#9A7A57"
edge_light = "#CDB28A"

outer_opacity = 0.70
inner_shadow_opacity = 0.18
feather = 30
inner_shadow_blur = 22

fold_opacity = 0.10