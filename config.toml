[theme]
background = "#F8F4EB"
primary = "#17466C"
secondary = "#557786"
accent = "#C7A165"

[map]
height = 640
center_longitude = 2.0
center_latitude = 20.0
zoom = 1.25


[map.sea]
color = "#438FA6"
deep_color = "#367A91"
light_color = "#65AABB"
broad_strength = 12.0
ripple_strength = 0.0
glint_red = 0.0
glint_green_blue = 0.0

[map.markers]
fill = "#C47A24"
border = "#FFFCF5"
flag = "#FFFFFF"

[map.frame]
enabled = true

edge_dark = "#6F5741"
edge_mid = "#9A7A57"
edge_light = "#CDB28A"

outer_opacity = 0.70
inner_shadow_opacity = 0.18
feather = 30
inner_shadow_blur = 22

fold_opacity = 0.10