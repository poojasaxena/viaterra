[theme]
background = "#F8F4EB"
primary = "#17466C"
secondary = "#557786"
accent = "#C7A165"

[map]
height = 640
center_longitude = 2.0
center_latitude = 20.0
zoom = 1.25


[map.sea]
color = "#438FA6"
deep_color = "#367A91"
light_color = "#65AABB"
broad_strength = 12.0
ripple_strength = 0.0
glint_red = 0.0
glint_green_blue = 0.0

[map.markers]
fill = "#C47A24"
border = "#FFFCF5"
flag = "#FFFFFF"


[map.frame]
enabled = true
asset = "viaterra_torquise_border"

width = 18
opacity = 1.0
slice_vertical = 14
slice_horizontal = 10