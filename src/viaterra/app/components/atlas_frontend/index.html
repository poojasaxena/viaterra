<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Echoes atlas</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <iframe id="atlas" title="Echoes interactive atlas" allow="geolocation"></iframe>
    <script>
        const atlas = document.getElementById('atlas');
        let args;
        let ready = false;

        function sendToStreamlit(type, payload) {
            window.parent.postMessage({isStreamlitMessage: true, type, ...payload}, '*');
        }

        function sendState() {
            if (!ready) return;
            atlas.contentWindow.postMessage({
                type: 'viaterra:state',
                token: args.save_token,
                result: args.save_result,
                places: args.places
            }, '*');
        }

        window.addEventListener('message', event => {
            const data = event.data;
            if (event.source === window.parent && data?.type === 'streamlit:render') {
                const firstRender = !args;
                args = data.args;
                if (firstRender) atlas.srcdoc = args.map_html;
                sendToStreamlit('streamlit:setFrameHeight', {height: args.height});
                sendState();
            } else if (event.source === atlas.contentWindow) {
                if (data?.type === 'viaterra:mapReady') {
                    ready = true;
                    sendState();
                } else if (data?.type === 'viaterra:save') {
                    sendToStreamlit('streamlit:setComponentValue', {
                        value: data.request,
                        dataType: 'json'
                    });
                }
            }
        });
        sendToStreamlit('streamlit:componentReady', {apiVersion: 1});
    </script>
</body>
</html>
